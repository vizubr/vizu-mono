

# Definição dos nossos serviços (containers)
services:
  # O serviço do nosso banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: vizu_user
      POSTGRES_PASSWORD: vizu_password
      POSTGRES_DB: vizu_infra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # O serviço do nosso cache/fila de mensagens
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # NOSSO BANCO VETORIAL QDRANT
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" # Porta gRPC (usada pelo client Python)
      - "6334:6334" # Porta REST (útil para acessar a UI no navegador)
    volumes:
      - qdrant_data:/qdrant/storage

# Define os volumes que serão usados pelos serviços para persistir dados
volumes:
  postgres_data:
  redis_data:
  qdrant_data:




